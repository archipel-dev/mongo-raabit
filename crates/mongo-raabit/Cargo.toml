[package]
name = "mongo-raabit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
description = "Mongo Raabit: the MongoDB GUI of the Archipel suite, as an Archipel plugin (views over mongo-raabit-core)"

[dependencies]
mongo-raabit-core.workspace = true
archipel-sdk.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
archipel-sdk = { workspace = true, features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
