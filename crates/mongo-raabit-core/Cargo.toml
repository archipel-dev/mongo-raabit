[package]
name = "mongo-raabit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Headless MongoDB client core for the mongo-raabit plugin"

[dependencies]
mongodb = "3.9"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
percent-encoding = "2.3"
sqlparser = "0.63"
csv = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "net", "sync"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
tempfile = "3"
proptest = "1"
