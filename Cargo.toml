[workspace]
resolver = "3"
members = ["crates/mongo-raabit-core", "crates/mongo-raabit", "crates/raabit", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.91"
repository = "https://github.com/archipel-dev/mongo-raabit"

[workspace.dependencies]
archipel-sdk = { git = "https://github.com/archipel-dev/sdk", branch = "main" }
mongo-raabit-core = { path = "crates/mongo-raabit-core" }
mongo-raabit = { path = "crates/mongo-raabit" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = { version = "2.5", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Until archipel-dev/kit#32 is merged: build against its branch (the www host is the same
# repository, a different source for cargo). Remove after the merge.
[patch."https://github.com/archipel-dev/kit"]
archipel-kit = { git = "https://www.github.com/archipel-dev/kit", branch = "claude/kit-lib-android-studio-ui-jleosm" }
