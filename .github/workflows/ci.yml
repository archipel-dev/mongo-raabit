name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Libraries egui/eframe (winit, glow, accesskit, xkbcommon, GTK file dialogs) link against.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libssl-dev libgl1-mesa-dev libwayland-dev libgtk-3-dev \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libfontconfig1-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Live tests skip here (no server); the `live` job runs them.
      - run: cargo test --workspace

  live:
    name: live tests (MongoDB ${{ matrix.mongo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongo: ["7.0", "8.0"]
    services:
      mongo:
        image: mongo:${{ matrix.mongo }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || mongo --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGO_RAABIT_TEST_URI: mongodb://127.0.0.1:27017
      # An unreachable server fails the tests instead of skipping them.
      MONGO_RAABIT_REQUIRE_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: live
      - run: cargo test -p mongo-raabit-core
