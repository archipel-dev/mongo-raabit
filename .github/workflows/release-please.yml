name: Release PR

# Opens and maintains a release pull request from Conventional Commits on main:
# it bumps [workspace.package] version in Cargo.toml, refreshes Cargo.lock and
# updates CHANGELOG.md. Merging it creates the `v<version>` tag, which triggers
# release.yml. See docs/release.md.
#
# Requires "Allow GitHub Actions to create and approve pull requests" to be
# enabled for the organization and repository (Settings → Actions → General),
# or a RELEASE_PLEASE_TOKEN secret (PAT / GitHub App token). Without either,
# release-please fails with "GitHub Actions is not permitted to create or approve
# pull requests".
on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Pushes, tags and PRs made with GITHUB_TOKEN do not trigger other
          # workflows (CI on the release PR, release.yml on the tag); a PAT or
          # App token in RELEASE_PLEASE_TOKEN fixes that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please does not know the version in Cargo.lock, so refresh the
      # workspace members' entries on the release PR branch.
      - name: Check out the release PR branch
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.release.outputs.prs_created == 'true'
      - name: Refresh Cargo.lock
        if: steps.release.outputs.prs_created == 'true'
        shell: bash
        run: |
          cargo update --workspace
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: update Cargo.lock for release"
            git push
          fi

      # Tags created with GITHUB_TOKEN do not start release.yml, but a manual
      # dispatch does, so start it explicitly. (With RELEASE_PLEASE_TOKEN the tag
      # push also triggers it; release.yml tolerates the double run because
      # assets are replaced in place.)
      - name: Start the release build
        if: steps.release.outputs.release_created == 'true' && env.HAS_PAT != 'true'
        env:
          HAS_PAT: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
