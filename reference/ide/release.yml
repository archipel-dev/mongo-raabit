name: Release

# Builds the archives (read by the IDE's self-updater) and the native installers
# (.msi, .dmg, .deb) on every platform, smoke-tests each installer, and
# publishes GitHub release `v<version>` when needed. See docs/release.md.
#
# Publication rules (version = [workspace.package] version in Cargo.toml):
# - push of tag `v<version>`: publish, or repair an incomplete release. The tag
#   must match the workspace version.
# - push to main: publish when release `v<version>` is missing, a draft, or
#   lacks assets, unless tag `v<version>` already points at another commit
#   (then push/re-run the tag instead, so binaries match the tag).
# - workflow_dispatch on any other branch: build and smoke-test only, never
#   publish (use it to test packaging changes on a branch).
# Pushes to main that publish nothing run only the checks.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "$tag" ]; then
              echo "::error::Tag $REF_NAME does not match workspace version $version (expected $tag)"
              exit 1
            fi
            echo "Tag $tag: publish or repair the release"
            publish=true
          elif [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            deb_version=${version/-/\~}
            expected=""
            for asset in \
              "jetthing-$version-linux-x86_64.tar.gz" \
              "jetthing-$version-windows-x86_64.zip" \
              "jetthing-$version-macos-aarch64.tar.gz" \
              "jetthing-$version-macos-x86_64.tar.gz" \
              "jetthing-$version-windows-x86_64.msi" \
              "jetthing-$version-macos-aarch64.dmg" \
              "jetthing-$version-macos-x86_64.dmg" \
              "jetthing_${deb_version}_amd64.deb" \
              "jetthing-$version-linux-x86_64.AppImage"; do
              expected="$expected $asset $asset.sha256"
            done
            published=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,assets --jq 'select(.isDraft | not) | .assets[].name' 2>/dev/null || true)
            missing=""
            for asset in $expected; do
              grep -qxF "$asset" <<< "$published" || missing="$missing $asset"
            done
            tag_commit=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n 1 | cut -f 1)
            if [ -z "$missing" ]; then
              echo "$tag is already released"
            elif [ -n "$tag_commit" ] && [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::warning::$tag is incomplete (missing:$missing) but the tag points at $tag_commit; re-run the workflow for the tag to repair it, or bump the version"
            else
              echo "$tag will be released (missing:$missing)"
              publish=true
            fi
          else
            echo "Branch $REF_NAME: build and test only"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p xtask -- parity --check

  build:
    name: package ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu keeps the .deb's glibc requirement low.
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
    env:
      # Optional signing; every step using them is skipped when they are unset.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install AppImage tooling
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y -q desktop-file-utils
          curl -sSLf -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          echo "46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1  $RUNNER_TEMP/appimagetool" | sha256sum -c
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "JETTHING_MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build archive and installer
        shell: bash
        run: cargo run -q -p xtask -- dist --installer --target ${{ matrix.target }} | tee "$RUNNER_TEMP/artifacts.txt"

      - name: Notarize DMG
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != '' && env.APPLE_ID != ''
        shell: bash
        run: |
          cd dist
          dmg=$(ls jetthing-*.dmg)
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"

      - name: Sign MSI
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP certificate.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Set-Location dist
          $msi = Get-ChildItem jetthing-*.msi | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 $msi.Name
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $pfx
          $hash = (Get-FileHash $msi.Name -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$($msi.Name).sha256", "$hash  $($msi.Name)`n")

      - name: Verify checksums
        shell: bash
        run: |
          cd dist
          for sum in *.sha256; do
            if command -v sha256sum > /dev/null; then sha256sum -c "$sum"; else shasum -a 256 -c "$sum"; fi
          done

      - name: Smoke-test .deb install and uninstall
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo dpkg -i dist/jetthing_*.deb
          dpkg -s jetthing | grep -E '^(Version|Depends):'
          test "$(cat /usr/lib/jetthing/jetthing.install)" = deb
          test -f /usr/share/applications/jetthing.desktop
          jetthing-cli commands > /dev/null
          sudo dpkg -r jetthing
          test ! -e /usr/bin/jetthing && test ! -e /usr/lib/jetthing

      - name: Smoke-test AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          appimage=$(ls dist/jetthing-*.AppImage)
          # No FUSE on runners: the runtime extracts itself instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract > /dev/null)
          for file in AppRun jetthing.desktop jetthing.png usr/bin/jetthing usr/bin/jetthing-cli; do
            test -e "$RUNNER_TEMP/squashfs-root/$file"
          done
          desktop-file-validate "$RUNNER_TEMP/squashfs-root/jetthing.desktop"

      - name: Smoke-test MSI install, upgrade code and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\jetthing-*.msi | Select-Object -First 1).FullName
          $install = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content install.log -Tail 50; exit $install.ExitCode }
          $dir = Join-Path $env:ProgramFiles Jetthing
          Get-ChildItem $dir -Recurse | Select-Object -ExpandProperty FullName
          if ((Get-Content (Join-Path $dir jetthing.install)).Trim() -ne 'msi') { throw 'install marker missing' }
          $shortcut = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Jetthing.lnk'
          if (-not (Test-Path $shortcut)) { throw 'Start Menu shortcut missing' }
          & (Join-Path $dir jetthing-cli.exe) commands | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'jetthing-cli failed' }
          $entry = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object DisplayName -eq 'Jetthing'
          $entry | Select-Object DisplayName, DisplayVersion, Publisher
          # Installing again exercises MajorUpgrade (same UpgradeCode replaces the old product).
          $again = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn" -Wait -PassThru
          if ($again.ExitCode -ne 0) { exit $again.ExitCode }
          $count = @(Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object DisplayName -eq 'Jetthing').Count
          if ($count -ne 1) { throw "expected one installed product, found $count" }
          $remove = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($remove.ExitCode -ne 0) { exit $remove.ExitCode }
          if (Test-Path $dir) { throw 'install directory left behind' }
          if (Test-Path $shortcut) { throw 'Start Menu shortcut left behind' }

      - name: Smoke-test DMG and app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mount="$RUNNER_TEMP/jetthing-dmg"
          hdiutil attach dist/jetthing-*.dmg -nobrowse -readonly -mountpoint "$mount"
          ls -la "$mount"
          test -L "$mount/Applications"
          app="$mount/Jetthing.app"
          plutil -lint "$app/Contents/Info.plist"
          plutil -p "$app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/jetthing"
          if [ "$(uname -m)" = "$(lipo -archs "$app/Contents/MacOS/jetthing-cli")" ]; then
            "$app/Contents/MacOS/jetthing-cli" commands > /dev/null
          fi
          hdiutil detach "$mount"

      - uses: actions/upload-artifact@v4
        with:
          name: jetthing-${{ needs.version.outputs.version }}-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.sha256

  manifests:
    # Homebrew cask, winget and Scoop manifests from the built artifacts'
    # checksums. Uploaded as a workflow artifact only; see docs/release.md for
    # submitting them.
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Render manifests
        run: |
          cargo run -q -p xtask -- manifests --dir artifacts \
            --version ${{ needs.version.outputs.version }} --out manifests
          find manifests -type f | sort
          cat manifests/homebrew/jetthing.rb
      - uses: actions/upload-artifact@v4
        with:
          name: package-manifests-${{ needs.version.outputs.version }}
          path: manifests
          if-no-files-found: error

  release:
    needs: [version, checks, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      # Check out before downloading: a checkout cleans the workspace and would
      # delete the downloaded artifacts (v0.0.8 was published without assets).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The section release-please wrote for this version ("## [x.y.z](...)").
          # Empty when CHANGELOG.md or the section is missing; the release then
          # falls back to GitHub's generated notes.
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, "## " v " ")) found = 1; next }
              found { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          fi
          if [ -s "$RUNNER_TEMP/notes.md" ] && grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "body_path=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Jetthing ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          files: artifacts/*
          fail_on_unmatched_files: true
